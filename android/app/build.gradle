plugins { id 'com.android.application' }

android {
    namespace 'org.forgesilicon.caesar'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'org.forgesilicon.caesar'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testHome = layout.buildDirectory.dir('test-home').get().asFile
            testHome.mkdirs()
            systemProperty 'user.home', testHome.absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort', 'javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
